<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#718096"/></marker>
  <style>
    text{font-family:Arial,sans-serif;fill:#263445}.title{font-size:28px;font-weight:700}.label{font-size:20px;font-weight:700}.detail{font-size:15px;fill:#526579}.arrow{stroke:#718096;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1000" height="560" rx="24" fill="#f7f9fc"/>
<text x="48" y="56" class="title">Как работает поиск вакансий</text>

<text x="48" y="112" class="label">1. Собираем вакансии</text>
<rect x="48" y="135" width="220" height="90" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="72" y="174" class="label">Сайты с вакансиями</text><text x="72" y="202" class="detail">Habr · Hirify · hh.ru</text>
<path d="M268 180 H345" class="arrow"/>
<rect x="355" y="135" width="245" height="90" rx="14" fill="#eaf3ff" stroke="#8db7e5" stroke-width="2"/>
<text x="380" y="174" class="label">Rails + Sidekiq</text><text x="380" y="202" class="detail">забирают и обрабатывают текст</text>
<path d="M600 180 H677" class="arrow"/>
<rect x="687" y="135" width="265" height="90" rx="14" fill="#eaf8f0" stroke="#91c9a8" stroke-width="2"/>
<text x="712" y="174" class="label">PostgreSQL</text><text x="712" y="202" class="detail">вакансии и их фрагменты</text>

<line x1="48" y1="270" x2="952" y2="270" stroke="#dbe3eb" stroke-width="2"/>
<text x="48" y="316" class="label">2. Ищем ответ на вопрос</text>
<rect x="48" y="340" width="190" height="92" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="72" y="378" class="label">Ты спрашиваешь</text><text x="72" y="407" class="detail">например: «Что требуют</text><text x="72" y="426" class="detail">от Rails-разработчика?»</text>
<path d="M238 385 H290" class="arrow"/>
<rect x="300" y="340" width="190" height="92" rx="14" fill="#f3edff" stroke="#b7a1df" stroke-width="2"/>
<text x="325" y="378" class="label">OpenAI</text><text x="325" y="407" class="detail">превращает вопрос</text><text x="325" y="426" class="detail">в вектор для поиска</text>
<path d="M490 385 H542" class="arrow"/>
<rect x="552" y="340" width="190" height="92" rx="14" fill="#eaf8f0" stroke="#91c9a8" stroke-width="2"/>
<text x="576" y="378" class="label">Поиск в базе</text><text x="576" y="407" class="detail">находит похожие</text><text x="576" y="426" class="detail">фрагменты вакансий</text>
<path d="M742 385 H794" class="arrow"/>
<rect x="804" y="340" width="148" height="92" rx="14" fill="#fff3e5" stroke="#e0b978" stroke-width="2"/>
<text x="828" y="378" class="label">Ответ</text><text x="828" y="407" class="detail">по найденным</text><text x="828" y="426" class="detail">вакансиям</text>

<path d="M820 225 V294 H647 V330" class="arrow"/>
<text x="662" y="291" class="detail">берёт фрагменты</text>
<text x="48" y="510" class="detail">В ответе можно открыть исходные вакансии и проверить требования.</text>
</svg>
