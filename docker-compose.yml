services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: matchmate_development
      POSTGRES_USER: matchmate
      POSTGRES_PASSWORD: matchmate_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchmate -d matchmate_development"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    image: cybergizer-we-re-looking-for-a-web
    command: ./bin/rails server -b 0.0.0.0
    environment:
      RAILS_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: matchmate
      DB_PASSWORD: matchmate_dev_password
      RAILS_MAX_THREADS: 5
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - .:/rails
      - bundle_data:/usr/local/bundle
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    image: cybergizer-we-re-looking-for-a-web
    command: bundle exec sidekiq -q default
    environment:
      RAILS_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: matchmate
      DB_PASSWORD: matchmate_dev_password
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - .:/rails
      - bundle_data:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  bundle_data:
  redis_data:
