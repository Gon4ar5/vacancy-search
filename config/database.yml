default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USERNAME", "matchmate") %>
  password: <%= ENV.fetch("DB_PASSWORD", "matchmate_dev_password") %>

development:
  <<: *default
  database: matchmate_development

test:
  <<: *default
  database: matchmate_test

production:
  primary:
    <<: *default
    database: <%= ENV.fetch("DB_NAME", "matchmate_production") %>
  cache:
    <<: *default
    database: <%= ENV.fetch("DB_CACHE_NAME", "matchmate_production_cache") %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: <%= ENV.fetch("DB_QUEUE_NAME", "matchmate_production_queue") %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: <%= ENV.fetch("DB_CABLE_NAME", "matchmate_production_cable") %>
    migrations_paths: db/cable_migrate
